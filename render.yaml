services:
  - type: web
    name: quizzmaker-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizzmaker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_ORIGINS
        sync: false

databases:
  - name: quizzmaker-db
    plan: free
    databaseName: quizzmaker
    user: quizzmaker
